apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: deployguard
  namespace: deployguard
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: deployguard.home.prateeksavanur.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: deployguard
                port:
                  number: 80
